<nav class="fixed top-0 inset-x-0 z-50 px-6 lg:px-16 py-4 flex items-center justify-between transition-all duration-300"
    [ngClass]="{
        'bg-transparent': !isSolid,
        'bg-white shadow-md border-b border-slate-200': isSolid
    }">

    <!-- Logo -->
    <a routerLink="/home" class="flex items-center gap-2 text-xl font-bold cursor-pointer transition"
        [ngClass]="{
            'text-white': !isSolid,
            'text-slate-900 hover:text-blue-600': isSolid
        }">
        <video src="assets/wheel.mp4" id="navLogoVideo" autoplay loop muted playsinline
            class="h-12 w-12 rounded-full animate-spin-slow" oncanplay="this.muted=true; this.volume=0.0;"
            style="filter:brightness(100%);"></video>
        <span>LuxeWheels</span>
    </a>

    <!-- Links -->
    <ul class="hidden lg:flex gap-8 font-semibold transition"
        [ngClass]="{
            'text-white': !isSolid,
            'text-slate-700': isSolid
        }">
        <!-- <li>
            <a routerLink="/used-cars" class="cursor-pointer" [ngClass]="{
                'hover:text-white': !isScrolled,
                'hover:text-slate-900': isScrolled
            }">Used Cars</a>
        </li>
        <li>
            <a routerLink="/new-cars" class="cursor-pointer" [ngClass]="{
                'hover:text-white': !isScrolled,
                'hover:text-slate-900': isScrolled
            }">New Cars</a>
        </li> -->
        <li>
            <a routerLink="/sell-car" class="cursor-pointer transition"
                [ngClass]="{
                    'hover:text-gray-300': !isSolid,
                    'hover:text-blue-600': isSolid
                }">Sell Your Car</a>
        </li>
        <li>
            <a routerLink="/financing" class="cursor-pointer transition"
                [ngClass]="{
                    'hover:text-gray-300': !isSolid,
                    'hover:text-blue-600': isSolid
                }">Financing</a>
        </li>
        <li>
            <a routerLink="/reviews" class="cursor-pointer transition"
                [ngClass]="{
                    'hover:text-gray-300': !isSolid,
                    'hover:text-blue-600': isSolid
                }">Reviews</a>
        </li>
    </ul>

    <!-- Actions -->
    <div class="flex items-center gap-4">
        <a routerLink="/cart" class="relative transition text-xl"
            [ngClass]="{
                'text-white hover:text-gray-300': !isSolid,
                'text-slate-700 hover:text-blue-600': isSolid
            }">
            <i class="fas fa-shopping-cart text-xl"></i>
            @if (cartItemCount | async; as count) {
            @if (count > 0) {
            <span class="absolute top-0 right-0 -translate-y-1/2 translate-x-1/2 bg-blue-600 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">
                {{ count }}
            </span>
            }
            }
        </a>
        <button routerLink="/signin" class="cursor-pointer font-semibold transition"
            [ngClass]="{
                'text-white hover:text-gray-300': !isSolid,
                'text-slate-700 hover:text-blue-600': isSolid
            }">
            Sign In
        </button>
        <button routerLink="/signup"
            class="cursor-pointer px-5 py-2 rounded-lg transition font-semibold"
            [ngClass]="{
                'bg-white text-slate-900 hover:bg-gray-100': !isSolid,
                'bg-slate-800 text-white hover:bg-slate-700': isSolid
            }">
            Get Started
        </button>
    </div>
</nav>
