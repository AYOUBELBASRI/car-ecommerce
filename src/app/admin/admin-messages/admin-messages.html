<div class="p-6">
  <h2 class="text-2xl font-bold text-gray-900 mb-6">Messages</h2>

  <div class="bg-white rounded-lg shadow-md overflow-hidden">
    <div class="p-6">
      <input type="text" placeholder="Search messages..."
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4">
    </div>
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sender</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Subject</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions
            </th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          @for (message of messages; track message.id) {
          <tr [class.font-bold]="!message.read">
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ message.sender }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-blue-600">{{ message.email }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ message.subject }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ message.date }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm">
              <span [class.bg-blue-100]="!message.read"
                [class.text-blue-800]="!message.read"
                [class.bg-gray-100]="message.read"
                [class.text-gray-800]="message.read"
                class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full">
                {{ message.read ? 'Read' : 'Unread' }}
              </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
              @if (!message.read) {
              <button (click)="markAsRead(message)" class="text-blue-600 hover:text-blue-900 mr-3">Mark as Read</button>
              }
              <button (click)="deleteMessage(message.id)" class="text-red-600 hover:text-red-900">Delete</button>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
