<div class="min-h-screen bg-slate-50">
  <div class="max-w-3xl mx-auto px-6 lg:px-16 py-16">
    <div class="bg-white rounded-2xl shadow-lg p-10 space-y-6">
      <h1 class="text-3xl font-bold text-slate-900">Contact the seller</h1>
      <p class="text-slate-600">
        Send a message to the seller to ask questions about this vehicle or request more details.
      </p>

      <form class="space-y-4" (ngSubmit)="onSendMessage()">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Your name *</label>
          <input [(ngModel)]="contactForm.name" name="name" required
            class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#343a40]"
            placeholder="Enter your full name" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Your email *</label>
          <input [(ngModel)]="contactForm.email" name="email" type="email" required
            class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#343a40]"
            placeholder="your@email.com" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Message *</label>
          <textarea [(ngModel)]="contactForm.message" name="message" rows="4" required
            class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#343a40]"
            placeholder="Hi, I’m interested in this car. Is it still available?"></textarea>
        </div>
        <button type="submit" [disabled]="isSubmitting || !isFormValid()"
          class="w-full bg-[#343a40] text-white py-3 rounded-lg hover:bg-[#495057] disabled:bg-[#495057] disabled:cursor-not-allowed transition font-medium">
          <span *ngIf="isSubmitting">Sending...</span>
          <span *ngIf="!isSubmitting">Send message</span>
        </button>
      </form>
    </div>
  </div>
</div>
