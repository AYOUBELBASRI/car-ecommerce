<header class="relative">
  <section class="relative h-screen w-full overflow-hidden">
    <div class="absolute inset-0">
      <video #heroBgVideo id="heroBgVideo" class="w-full h-full object-cover hero-bg" src="assets/digitalisme.mp4" autoplay muted loop
        playsinline preload="auto" aria-hidden="true" tabindex="-1"
        oncanplay="this.muted=true; this.volume=0.0;"
        style="filter: grayscale(30%) brightness(100%);">
      </video>
      <div class="absolute inset-0 bg-black/60"></div>
    </div>

    <div class="relative z-10 h-full flex items-center">
      <div class="w-full max-w-7xl mx-auto px-6 lg:px-16 pt-28">
        <div class="max-w-2xl text-white hero-content">
          <h1 class="text-4xl lg:text-6xl font-bold leading-tight font-gravitas">
            Find the Car <br />
            You Deserve
          </h1>

          <p class="mt-5 text-white/90 max-w-xl">
            Browse thousands of certified vehicles with a 7-day
            money-back guarantee. Quality you can trust, prices you'll love.
          </p>

          <div class="mt-8 flex flex-wrap gap-4">
            <button routerLink="/cars"
              class="cursor-pointer bg-white text-slate-900 px-7 py-3 rounded-xl hover:bg-white/90 transition font-semibold">
              Browse Inventory
            </button>

            <button routerLink="/how-it-works"
              class="cursor-pointer border border-white/50 text-white px-7 py-3 rounded-xl hover:bg-white/10 transition font-semibold">
              How it Works
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="bg-slate-50">
    <div class="max-w-7xl mx-auto px-6 lg:px-16 py-10">
      <!-- VIDEO SECTION -->
      <section class="w-full">
        <div class="w-full rounded-2xl overflow-hidden shadow-lg flex justify-center bg-white">
          <a data-pin-do="embedPin" data-pin-width="large" href="https://pin.it/7mhXqO7T4">
          </a>
        </div>
      </section>

      <!-- SEARCH BAR -->
      <section
        class="cursor-pointer bg-white rounded-2xl shadow-lg px-6 py-6 flex flex-col lg:flex-row items-center gap-6 mt-10">

        <!-- Condition -->
        <div class="cursor-pointer flex flex-col w-full lg:w-1/5">
          <span class="text-xs text-black uppercase">Condition</span>
          <select class="mt-1 font-medium outline-none">
            @for (c of conditions; track c) {
            <option>{{ c }}</option>
            }
          </select>
        </div>

        <!-- Make -->
        <div class="cursor-pointer flex flex-col w-full lg:w-1/5 border-l lg:pl-6 ">
          <span class="text-xs text-black uppercase">Make</span>
          <select class="mt-1 font-medium outline-none">
            @for (m of makes; track m) {
            <option>{{ m }}</option>
            }
          </select>
        </div>

        <!-- Model -->
        <div class="cursor-pointer flex flex-col w-full lg:w-1/5 border-l lg:pl-6">
          <span class="text-xs text-black uppercase">Model</span>
          <select class="mt-1 font-medium outline-none">
            @for (m of models; track m) {
            <option>{{ m }}</option>
            }
          </select>
        </div>

        <!-- Price -->
        <div class="cursor-pointer flex flex-col w-full lg:w-1/5 border-l lg:pl-6">
          <span class="text-xs text-black uppercase">Price Range</span>
          <select class="mt-1 font-medium outline-none">
            @for (p of priceRanges; track p) {
            <option>{{ p }}</option>
            }
          </select>
        </div>

        <!-- Button -->
        <button routerLink="/cars"
          class="cursor-pointer w-full lg:w-auto bg-slate-900 text-white px-8 py-4 rounded-xl hover:bg-slate-800 transition font-medium">
          Search 12,403 Cars
        </button>

      </section>

      <!-- BRANDS -->
      <section class="mt-16 overflow-hidden">
        <div class="brand-marquee">
          <div class="brand-marquee-wrapper">
            <div class="brand-marquee-content">
              @for (icon of brandIcons; track $index) {
              <img [src]="icon" alt="Brand" class="h-8 grayscale hover:grayscale-0 transition mx-8" />
              }
            </div>
            <div class="brand-marquee-content" aria-hidden="true">
              @for (icon of brandIcons; track $index) {
              <img [src]="icon" alt="Brand" class="h-8 grayscale hover:grayscale-0 transition mx-8" />
              }
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</header>
