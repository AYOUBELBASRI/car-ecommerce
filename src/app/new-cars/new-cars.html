<div class="min-h-screen bg-slate-50">
  <div class="max-w-7xl mx-auto px-6 lg:px-16 py-8">
    <div class="flex items-center justify-between mb-10">
      <div>
        <h1 class="text-3xl font-bold">New Cars</h1>
        <p class="text-slate-600 mt-1">Explore our latest brand new vehicles</p>
      </div>
      <a routerLink="/home" class="text-[#343a40] hover:text-[#495057] font-medium">← Back to Home</a>
    </div>

    <div class="flex items-center justify-between mb-6">
      <p class="text-slate-600">{{ totalCars }} new cars available</p>
      <a routerLink="/used-cars" class="text-[#343a40] hover:text-[#495057] font-medium">Browse Used Cars</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      @for (car of cars; track car) {
      <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition">
        <a [routerLink]="['/car', car.id]" class="block">
          <img [src]="car.image" [alt]="car.make + ' ' + car.model" class="w-full h-48 object-cover">
        </a>
        <div class="p-4">
          <h3 class="text-xl font-bold">{{ car.year }} {{ car.make }} {{ car.model }}</h3>
          <p class="text-2xl font-bold text-[#343a40] mt-2">${{ car.price | number:'1.0-0' }}</p>

          <div class="mt-4 flex flex-wrap gap-4 text-sm text-slate-600">
            <span>{{ car.mileage }}</span>
            <span>{{ car.fuel }}</span>
            <span>{{ car.drive }}</span>
          </div>

          <button [routerLink]="['/car', car.id]"
            class="w-full mt-4 bg-[#343a40] text-white py-2 rounded-lg hover:bg-[#495057] transition">
            View Details
          </button>
        </div>
      </div>
      }
    </div>
  </div>
</div>
